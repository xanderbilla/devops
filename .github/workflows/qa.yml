name: QA - Auto Merge to PRE-PROD

on:
  push:
    branches:
      - qa
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-merge:
    name: Auto-merge to PRE-PROD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge to PRE-PROD
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin pre-prod
          git checkout pre-prod
          git merge origin/qa --no-ff -m "🚀 Auto-promote QA to PRE-PROD - ${{ github.sha }}"
          git push origin pre-prod

          echo "✅ Auto-merged QA to PRE-PROD branch"
