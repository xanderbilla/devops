name: QA - Auto Merge to PRE-PROD

on:
  push:
    branches:
      - qa
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-merge:
    name: Auto-merge to PRE-PROD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge to PRE-PROD
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/xanderbilla/devops.git
          git fetch origin pre-prod
          git checkout pre-prod
          git merge origin/qa --no-ff -m "🚀 Auto-promote QA to PRE-PROD - ${{ github.sha }}"
          git push origin pre-prod

          echo "✅ Auto-merged QA to PRE-PROD branch"

      - name: Trigger PRE-PROD Workflow
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            https://api.github.com/repos/xanderbilla/devops/actions/workflows/pre-prod.yml/dispatches \
            -d '{"ref":"pre-prod"}'

          echo "✅ Triggered PRE-PROD workflow"
