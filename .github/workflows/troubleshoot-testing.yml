name: Troubleshoot Testing Backend

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  diagnose:
    name: Diagnose Backend Issues
    runs-on: ubuntu-latest
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check ECS Service Status
        run: |
          echo "### ECS Service Status" >> $GITHUB_STEP_SUMMARY
          aws ecs describe-services --cluster ankit-testing-cluster --services ankit-testing-backend-service \
            --query 'services[0].{Status:status,Running:runningCount,Desired:desiredCount,Pending:pendingCount}' \
            --output table >> $GITHUB_STEP_SUMMARY

      - name: Check Running Tasks
        run: |
          echo "### Running Tasks" >> $GITHUB_STEP_SUMMARY
          TASK_ARN=$(aws ecs list-tasks --cluster ankit-testing-cluster --service-name ankit-testing-backend-service --query 'taskArns[0]' --output text)
          if [ "$TASK_ARN" != "None" ] && [ -n "$TASK_ARN" ]; then
            echo "Task found: $TASK_ARN" >> $GITHUB_STEP_SUMMARY
            aws ecs describe-tasks --cluster ankit-testing-cluster --tasks $TASK_ARN \
              --query 'tasks[0].{LastStatus:lastStatus,HealthStatus:healthStatus,Connectivity:connectivity}' \
              --output table >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ No running tasks!" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check Stopped Tasks
        run: |
          echo "### Recent Stopped Tasks" >> $GITHUB_STEP_SUMMARY
          STOPPED_TASK=$(aws ecs list-tasks --cluster ankit-testing-cluster --service-name ankit-testing-backend-service --desired-status STOPPED --max-results 1 --query 'taskArns[0]' --output text)
          if [ "$STOPPED_TASK" != "None" ] && [ -n "$STOPPED_TASK" ]; then
            echo "Stopped task: $STOPPED_TASK" >> $GITHUB_STEP_SUMMARY
            aws ecs describe-tasks --cluster ankit-testing-cluster --tasks $STOPPED_TASK \
              --query 'tasks[0].{StoppedReason:stoppedReason,StopCode:stopCode,Container:containers[0].reason}' \
              --output table >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check RDS Status
        run: |
          echo "### RDS Database Status" >> $GITHUB_STEP_SUMMARY
          aws rds describe-db-instances --db-instance-identifier ankit-testing-postgres \
            --query 'DBInstances[0].{Status:DBInstanceStatus,Endpoint:Endpoint.Address,Port:Endpoint.Port}' \
            --output table >> $GITHUB_STEP_SUMMARY

      - name: Check NAT Instance
        run: |
          echo "### NAT Instance Status" >> $GITHUB_STEP_SUMMARY
          aws ec2 describe-instances --filters "Name=tag:Name,Values=ankit-testing-nat-instance" \
            --query 'Reservations[0].Instances[0].{State:State.Name,PrivateIP:PrivateIpAddress,PublicIP:PublicIpAddress,SourceDestCheck:SourceDestCheck}' \
            --output table >> $GITHUB_STEP_SUMMARY

      - name: Check ALB Target Health
        run: |
          echo "### ALB Target Health" >> $GITHUB_STEP_SUMMARY
          TG_ARN=$(aws elbv2 describe-target-groups --names ankit-testing-backend-tg --query 'TargetGroups[0].TargetGroupArn' --output text 2>/dev/null)
          if [ -n "$TG_ARN" ] && [ "$TG_ARN" != "None" ]; then
            aws elbv2 describe-target-health --target-group-arn $TG_ARN --output table >> $GITHUB_STEP_SUMMARY
          else
            echo "Target group not found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Get Backend Logs
        run: |
          echo "### Recent Backend Logs (Last 50 lines)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          aws logs tail /ecs/ankit-testing-backend --since 30m --format short 2>/dev/null | tail -50 >> $GITHUB_STEP_SUMMARY || echo "No logs available" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Check ECR Image
        run: |
          echo "### ECR Images" >> $GITHUB_STEP_SUMMARY
          aws ecr describe-images --repository-name springboot-backend \
            --query 'sort_by(imageDetails,&imagePushedAt)[-5:].{Tags:imageTags,Pushed:imagePushedAt}' \
            --output table >> $GITHUB_STEP_SUMMARY

      - name: Check Security Groups
        run: |
          echo "### Security Group Rules" >> $GITHUB_STEP_SUMMARY
          echo "ECS Security Group:" >> $GITHUB_STEP_SUMMARY
          SG_ID=$(aws ec2 describe-security-groups --filters "Name=tag:Name,Values=ankit-testing-ecs-sg" --query 'SecurityGroups[0].GroupId' --output text)
          if [ -n "$SG_ID" ]; then
            aws ec2 describe-security-groups --group-ids $SG_ID \
              --query 'SecurityGroups[0].{Ingress:IpPermissions,Egress:IpPermissionsEgress}' \
              --output table >> $GITHUB_STEP_SUMMARY
          fi

      - name: Summary
        run: |
          echo "### 🔍 Diagnostic Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the sections above to identify the issue:" >> $GITHUB_STEP_SUMMARY
          echo "- If no running tasks: Check stopped task reason" >> $GITHUB_STEP_SUMMARY
          echo "- If CannotPullContainer: NAT instance issue" >> $GITHUB_STEP_SUMMARY
          echo "- If container exited: Check backend logs" >> $GITHUB_STEP_SUMMARY
          echo "- If unhealthy targets: Backend not responding on port 8080" >> $GITHUB_STEP_SUMMARY
