name: Deploy to QA

on:
  push:
    branches:
      - qa
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY_FE: ${{ secrets.ECR_REPOSITORY_FE }}
  ECR_REPOSITORY_BE: ${{ secrets.ECR_REPOSITORY_BE }}
  IMAGE_TAG: ${{ github.ref_name }}-${{ github.sha }}

jobs:
  build:
    name: Build and Push Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_QA }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_QA }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Build and Push Frontend Docker Image
        working-directory: ./frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_FE:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY_FE:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY_FE:qa-latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_FE:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_FE:qa-latest

      - name: Build Backend
        working-directory: ./Backend
        run: |
          ./mvnw clean package -DskipTests

      - name: Build and Push Backend Docker Image
        working-directory: ./Backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_BE:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY_BE:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY_BE:qa-latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_BE:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_BE:qa-latest

  deploy:
    name: Deploy to QA
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: qa
      url: https://qa.yourdomain.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_QA }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_QA }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy to QA Environment
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "Deploying to QA environment..."
          echo "Frontend Image: $ECR_REGISTRY/$ECR_REPOSITORY_FE:$IMAGE_TAG"
          echo "Backend Image: $ECR_REGISTRY/$ECR_REPOSITORY_BE:$IMAGE_TAG"
          # Add your deployment commands here:
          # - ECS: aws ecs update-service --cluster qa-cluster --service frontend-service --force-new-deployment
          # - EC2: ssh to instance and docker pull + restart
          # - Docker Compose: docker-compose pull && docker-compose up -d

      - name: Deployment Summary
        run: |
          echo "✅ QA Deployment Complete"
          echo "Environment: QA"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Image Tag: $IMAGE_TAG"
