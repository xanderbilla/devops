name: PRE-PROD - Build, Deploy and Test

on:
  push:
    branches:
      - pre-prod
  workflow_dispatch:

permissions:
  contents: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY_FE: ${{ secrets.ECR_REPOSITORY_FE }}
  ECR_REPOSITORY_BE: ${{ secrets.ECR_REPOSITORY_BE }}
  IMAGE_TAG: pre-prod-${{ github.sha }}

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_TESTING }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_TESTING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Build and Push Frontend Docker Image
        working-directory: ./frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_FE:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY_FE:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY_FE:pre-prod-latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_FE:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_FE:pre-prod-latest

      - name: Build Backend
        working-directory: ./Backend
        run: |
          ./mvnw clean package -DskipTests

      - name: Build and Push Backend Docker Image
        working-directory: ./Backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_BE:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY_BE:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY_BE:pre-prod-latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_BE:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_BE:pre-prod-latest

      - name: Deployment Summary
        run: |
          echo "✅ PRE-PROD Docker Images Pushed to ECR"
          echo "Environment: PRE-PROD (Testing)"
          echo "Image Tag: $IMAGE_TAG"

  auto-merge-to-prod:
    name: Auto-merge to PROD
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge to PROD
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin prod
          git checkout prod
          git merge origin/pre-prod --no-ff -m "🚀 Auto-promote PRE-PROD to PROD - ${{ github.sha }}"
          git push origin prod

          echo "✅ Auto-merged PRE-PROD to PROD branch"
