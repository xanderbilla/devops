name: Deploy to DEV

on:
  push:
    branches:
      - dev
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY_FE: ${{ secrets.ECR_REPOSITORY_FE }}
  ECR_REPOSITORY_BE: ${{ secrets.ECR_REPOSITORY_BE }}
  IMAGE_TAG: ${{ github.ref_name }}-${{ github.sha }}

jobs:
  build-and-deploy:
    name: Build and Deploy to DEV
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Build and Push Frontend Docker Image
        working-directory: ./frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_FE:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY_FE:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY_FE:dev-latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_FE:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_FE:dev-latest

      - name: Build Backend
        working-directory: ./Backend
        run: |
          ./mvnw clean package -DskipTests

      - name: Build and Push Backend Docker Image
        working-directory: ./Backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_BE:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY_BE:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY_BE:dev-latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_BE:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_BE:dev-latest

      - name: Deploy to DEV Environment
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "Deploying to DEV environment..."
          echo "Frontend Image: $ECR_REGISTRY/$ECR_REPOSITORY_FE:$IMAGE_TAG"
          echo "Backend Image: $ECR_REGISTRY/$ECR_REPOSITORY_BE:$IMAGE_TAG"
          # Add your deployment commands here:
          # - ECS: aws ecs update-service --cluster dev-cluster --service frontend-service --force-new-deployment
          # - EC2: ssh to instance and docker pull + restart
          # - Docker Compose: docker-compose pull && docker-compose up -d

      - name: Deployment Summary
        run: |
          echo "✅ DEV Deployment Complete"
          echo "Environment: DEV"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Image Tag: $IMAGE_TAG"

      - name: Create PR to QA
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if PR already exists
          EXISTING_PR=$(gh pr list --base qa --head dev --json number --jq '.[0].number')

          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --base qa \
              --head dev \
              --title "🚀 Promote DEV to QA - ${{ github.sha }}" \
              --body "**Automated promotion from DEV to QA**
              
              - Commit: ${{ github.sha }}
              - Author: ${{ github.actor }}
              - Image Tag: $IMAGE_TAG
              
              ✅ DEV deployment successful
              
              **Next Steps:**
              1. Review changes
              2. Approve and merge this PR
              3. QA deployment will trigger automatically
              4. After QA success, auto-promotes to PRE-PROD
              5. After PRE-PROD success, auto-promotes to PROD"
            echo "✅ Created PR to QA branch"
          else
            echo "ℹ️ PR #$EXISTING_PR already exists for dev → qa"
          fi
